<div class="row">
<div><label>Nazwa sali</label><input name="name" value="{{ r.name if r else '' }}" required></div>
<div><label>Pojemność (osób)</label><input name="capacity" type="number" min="1" value="{{ r.capacity if r else 8 }}" style="width:90px"></div>
<div><label>Lokalizacja</label><select name="site_id"><option value="">—</option>{% for s in sites %}<option value="{{ s.id }}" {% if r and r.site_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div>
<div style="min-width:260px"><label>Skrzynka sali (M365) / kalendarz zasobu (Google)</label><input name="calendar_id" value="{{ r.calendar_id or '' if r else '' }}" placeholder="sala.duza@firma.pl" style="width:100%"></div>
</div><div class="row">
<div><label>Opiekun sali</label><select name="caretaker_id"><option value="">—</option>{% for u in users %}<option value="{{ u.id }}" {% if r and r.caretaker_id==u.id %}selected{% endif %}>{{ u.name or u.email }}</option>{% endfor %}</select></div>
<div><label>Zastępca opiekuna</label><select name="deputy_id"><option value="">—</option>{% for u in users %}<option value="{{ u.id }}" {% if r and r.deputy_id==u.id %}selected{% endif %}>{{ u.name or u.email }}</option>{% endfor %}</select></div>
<div><label>Check-in</label><select name="checkin_required"><option value="0">nie wymagany</option><option value="1" {% if r and r.checkin_required %}selected{% endif %}>wymagany</option></select></div>
<div><label>Zwolnij salę po (min) bez check-in</label><input name="checkin_minutes" type="number" min="1" value="{{ r.checkin_minutes if r else 10 }}" style="width:90px"></div>
</div>
