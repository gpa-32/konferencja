services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sale
      POSTGRES_USER: sale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw w .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sale"]
      interval: 10s

  app:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sale:${POSTGRES_PASSWORD}@db:5432/sale
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]

  # Opcjonalnie: własny serwer RustDesk do zdalnego podglądu tabletów (porty 21115-21117).
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    restart: unless-stopped
    profiles: ["rustdesk"]
    ports: ["21115:21115", "21116:21116", "21116:21116/udp"]
    volumes: ["rustdesk:/root"]
  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    restart: unless-stopped
    profiles: ["rustdesk"]
    ports: ["21117:21117"]
    volumes: ["rustdesk:/root"]

volumes:
  pgdata:
  appdata:
  caddydata:
  rustdesk:
